<!DOCTYPE html>
<html>
<head>
    <title>Вход — Productify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2>🔑 Вход</h2>
    <p>Войди в свой аккаунт</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p style="color: {% if category == 'error' %}#ff4b5c{% else %}#28a745{% endif %}; margin: 10px;">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/login" style="margin-top: 20px;">
        <input type="text" name="username" placeholder="Имя пользователя" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit" class="btn">Войти</button>
    </form>

    <p style="margin-top: 20px;">Нет аккаунта? <a href="/register" style="color: #ff4b5c;">Регистрация</a></p>
    <p><a href="/" style="color: #ccc;">← На главную</a></p>
</div>

</body>
</html>
